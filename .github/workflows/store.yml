name: Production Release (store)

on:
  push:
    branches: [ store ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-store
  cancel-in-progress: false

env:
  TAG_PREFIX: "store-v"
  RELEASE_TITLE: "Scann Production"

jobs:
  release:
    if: github.ref == 'refs/heads/store'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew

      - name: Resolve version and tag
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            echo "::error::Shallow clone; versionCode would be wrong."; exit 1
          fi
          VC=$(git rev-list --count HEAD)
          TAG="${TAG_PREFIX}1.0.${VC}"
          if gh release view "$TAG" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag/release $TAG already exists."; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=Scann-${TAG}.apk" >> "$GITHUB_OUTPUT"

      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties

      - name: Build signed release APK and AAB
        run: ./gradlew assembleRelease bundleRelease

      - name: Verify APK signature and rename
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          case "$APK" in *unsigned*) echo "::error::APK is unsigned"; exit 1;; esac
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify "$APK"
          mv "$APK" "${{ steps.ver.outputs.name }}"

      - name: Create GitHub Release (APK only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" "${{ steps.ver.outputs.name }}" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE ${{ steps.ver.outputs.tag }}" \
            --generate-notes \
            --latest

      - name: Upload AAB to Google Play (Production)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.scann.thekami
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: production
          status: completed

      - name: Clean up signing files
        if: always()
        run: rm -f app/release.keystore key.properties
