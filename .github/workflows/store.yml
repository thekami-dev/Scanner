
name: Production Release (store)

on:
  push:
    branches: [store]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-store
  cancel-in-progress: false

env:
  TAG_PREFIX: "store-v"
  RELEASE_TITLE: "Scann Production"

jobs:
  release:
    if: github.ref == 'refs/heads/store'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle
        run: chmod +x gradlew

      - name: Resolve version and tag
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            echo "::error::Shallow clone; version resolution would be wrong."
            exit 1
          fi

          git fetch --tags origin

          # Start with the current commit count.
          VC=$(git rev-list --count HEAD)

          # Find the highest existing production tag number.
          MAX_TAG_VC=$(
            git tag -l "${TAG_PREFIX}1.0.*" |
            sed -nE 's/^store-v1\.0\.([0-9]+)$/\1/p' |
            sort -n |
            tail -1
          )

          # Prevent duplicate tags, including reruns on the same commit.
          if [[ -n "$MAX_TAG_VC" ]] && (( VC <= MAX_TAG_VC )); then
            VC=$((MAX_TAG_VC + 1))
          fi

          TAG="${TAG_PREFIX}1.0.${VC}"

          if gh release view "$TAG" >/dev/null 2>&1 ||
             git ls-remote --exit-code --tags origin \
               "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag/release $TAG already exists."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk_name=Scann-${TAG}.apk" >> "$GITHUB_OUTPUT"
          echo "aab_name=Scann-${TAG}.aab" >> "$GITHUB_OUTPUT"

          echo "Resolved production tag: $TAG"

      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64" || {
            echo "::error::KEYSTORE_BASE64 secret is missing."
            exit 1
          }

          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore

          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties

      - name: Build signed release APK and AAB
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify and rename APK and AAB
        env:
          APK_NAME: ${{ steps.ver.outputs.apk_name }}
          AAB_NAME: ${{ steps.ver.outputs.aab_name }}
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/release"
          AAB_DIR="app/build/outputs/bundle/release"

          mapfile -t APKS < <(
            find "$APK_DIR" -maxdepth 1 -type f \
              -name '*.apk' ! -name '*unsigned*' | sort
          )

          mapfile -t AABS < <(
            find "$AAB_DIR" -maxdepth 1 -type f \
              -name '*.aab' ! -name '*unsigned*' | sort
          )

          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one signed release APK."
            exit 1
          fi

          if [ "${#AABS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one release AAB."
            exit 1
          fi

          APK="${APKS[0]}"
          AAB="${AABS[0]}"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"

          if [ -z "$BUILD_TOOLS" ]; then
            echo "::error::Android build-tools not found."
            exit 1
          fi

          # Verify APK signature.
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"

          # Verify that the AAB is signed.
          jarsigner -verify "$AAB"

          # Rename artifacts for the GitHub Release.
          mv "$APK" "$APK_NAME"
          mv "$AAB" "$AAB_NAME"

          echo "Verified artifacts:"
          ls -lh "$APK_NAME" "$AAB_NAME"

      - name: Create GitHub Release (APK + AAB)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          APK_NAME: ${{ steps.ver.outputs.apk_name }}
          AAB_NAME: ${{ steps.ver.outputs.aab_name }}
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            "$APK_NAME" \
            "$AAB_NAME" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE $TAG" \
            --generate-notes \
            --latest

      # Google Play automatic upload is intentionally disabled for now.
      # To enable it later, uncomment this entire step.
      #
      # - name: Upload AAB to Google Play (Production)
      #   uses: r0adkll/upload-google-play@v1
      #   with:
      #     serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
      #     packageName: com.scann.thekami
      #     releaseFiles: app/build/outputs/bundle/release/*.aab
      #     track: production
      #     status: completed

      - name: Clean up signing files
        if: always()
        run: rm -f app/release.keystore key.properties
