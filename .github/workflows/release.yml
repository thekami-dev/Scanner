name: Public Release (main)

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  APP_ID: "com.scann.thekami"
  TAG_PREFIX: "v"
  RELEASE_TITLE: "Scann"
  MAKE_LATEST: "false"

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Check signing secrets exist
        env:
          S1: ${{ secrets.KEYSTORE_BASE64 }}
          S2: ${{ secrets.KEYSTORE_PASSWORD }}
          S3: ${{ secrets.KEY_ALIAS }}
          S4: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in S1 S2 S3 S4; do
            if [ -z "${!v}" ]; then
              echo "::error::A signing secret is missing or empty"; exit 1
            fi
          done

      - name: Resolve version and tag
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            echo "::error::Shallow clone; versionCode would be wrong."; exit 1
          fi
          VC=$(git rev-list --count HEAD)
          VN="1.0.${VC}"
          TAG="${TAG_PREFIX}${VN}"
          if gh release view "$TAG" >/dev/null 2>&1 \
             || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag/release $TAG already exists."; exit 1
          fi
          {
            echo "code=$VC"
            echo "version=$VN"
            echo "tag=$TAG"
            echo "name=Scann-${TAG}.apk"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties

      - name: Build signed release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify and rename APK
        id: apk
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          OUT_NAME: ${{ steps.ver.outputs.name }}
        run: |
          set -e
          COUNT=$(ls app/build/outputs/apk/release/*.apk | wc -l)
          [ "$COUNT" -eq 1 ] || { echo "::error::Expected exactly 1 APK, found $COUNT"; exit 1; }
          APK=$(ls app/build/outputs/apk/release/*.apk)
          case "$APK" in *unsigned*) echo "::error::APK is unsigned"; exit 1;; esac
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify "$APK"
          BADGING=$("$BT/aapt2" dump badging "$APK")
          echo "$BADGING" | grep -q "package: name='${APP_ID}'" \
            || { echo "::error::Wrong package name"; exit 1; }
          echo "$BADGING" | grep -q "versionName='${VERSION}'" \
            || { echo "::error::versionName does not match tag"; exit 1; }
          mv "$APK" "$OUT_NAME"
          echo "sha256=$(sha256sum "$OUT_NAME" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release (APK only)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          APK_NAME: ${{ steps.ver.outputs.name }}
          SHA256: ${{ steps.apk.outputs.sha256 }}
        run: |
          gh release create "$TAG" "$APK_NAME" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE $TAG" \
            --notes "SHA-256: \`$SHA256\`" \
            --generate-notes \
            --latest="$MAKE_LATEST"

      - name: Clean up signing files
        if: always()
        run: rm -f app/release.keystore key.properties
